<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>زهى | نظام التشغيل والصيانة</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#2563eb" />
    <!-- يُطبَّق قبل أول رسم للصفحة — يمنع "وميض" الوضع الفاتح لحظياً قبل
         أن يقرأ React تفضيل الوضع الداكن المحفوظ (انظر src/client/lib/theme.ts). -->
    <script>
      try {
        if (localStorage.getItem('zaha-ops:theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Noto Sans Bengali يغطي حروف اللغة البنغالية (خيار واجهة الفنيين
         الميدانيين، انظر TopBar.tsx) — Cairo لا يحتوي حروفاً بنغالية،
         فتقع أي رسالة بنغالية على هذا الخط تلقائياً حسب ترتيب حزمة الخطوط
         في index.css (--font-sans) دون أي شرط إضافي بالجافاسكربت. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Leaflet + Leaflet.draw — خريطة مناطق الرياض التفاعلية القابلة
         للتعديل (الإعدادات ← مناطق الرياض، RiyadhZonesTab في Settings.tsx)
         فقط. OpenStreetMap مجاني بلا حاجة لمفتاح API، بخلاف خرائط جوجل. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
